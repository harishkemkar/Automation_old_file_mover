<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Management Utility</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 6px;
            color: #444;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .radio-group {
            margin-bottom: 20px;
        }

        .radio-group input {
            margin-right: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007BFF;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #0056b3;
        }

        ul {
            margin-top: 20px;
            padding: 10px;
            background: #eaf4ff;
            border-radius: 5px;
            list-style-type: none;
        }

        ul li {
            color: #333;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📂 File Management Menu</h1>
        <form method="POST">
            <label>Source Folder:</label>
            <input type="text" name="source_folder" placeholder="Default: Source">

            <label>Target Folder:</label>
            <input type="text" name="target_folder" placeholder="Default: Target">

            <div class="radio-group">
                <label>Choose an option:</label>
                <input type="radio" name="choice" value="1"> Move files older than N days<br>
                <input type="radio" name="choice" value="2"> Move files with a specific extension
            </div>

            <label>Days Old:</label>
            <input type="number" name="days_old" placeholder="Enter number of days">

            <label>Extension:</label>
            <input type="text" name="extension" placeholder=".txt, .log, .pdf">

            <button type="submit">🚀 Run</button>
        </form>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <ul>
              {% for msg in messages %}
                <li>{{ msg }}</li>
              {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}
    </div>
</body>
</html>
